services:
  postgres:
    image: postgres:16-alpine
    container_name: banklens_postgres
    environment:
      POSTGRES_USER: banklens
      POSTGRES_PASSWORD: password
      POSTGRES_DB: banklens_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banklens"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
